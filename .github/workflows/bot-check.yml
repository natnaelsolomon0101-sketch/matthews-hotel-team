name: Bot access check

# Confirms every AI/search-bot user-agent allowed in robots.ts actually gets
# a clean 200 from production — i.e. nothing in Vercel Firewall (Bot
# Protection / Attack Challenge Mode / managed rulesets) is silently
# blocking or challenging them. See scripts/bot-check.sh and
# geo/02-crawl-index.md.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to check"
        required: false
        default: "https://matthewshotelmarkets.com"
  schedule:
    # Weekly, Mondays 8am UTC — catches a Firewall setting someone flips in
    # the dashboard without touching this repo.
    - cron: "0 8 * * 1"

jobs:
  bot-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run bot-check.sh
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://matthewshotelmarkets.com' }}
        run: ./scripts/bot-check.sh
